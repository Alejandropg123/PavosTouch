<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0d0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Control de Operaciones</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="bg" aria-hidden="true"><span class="b1"></span><span class="b2"></span><span class="b3"></span></div>

<header class="topbar">
  <div class="brand">
    <span class="logo" id="logo"></span>
    <span class="brand-name">Control<b>Ops</b></span>
  </div>
  <nav class="pills glass" id="pills"></nav>
  <div class="top-right">
    <div class="seg glass" id="empresaSeg"></div>
    <button class="btn primary new-btn" data-act="new-op" id="newBtn" title="Nueva operación"></button>
    <button class="icon-btn glass" data-act="nav" data-view="documentos" title="Documentos con alertas" id="bellBtn"></button>
    <button class="avatar" data-act="account" title="Administrador">AP</button>
  </div>
</header>

<main id="view" class="view"></main>

<nav class="bottomnav glass" id="bottomnav"></nav>

<div class="overlay" id="overlay" data-act="close"></div>
<section class="drawer glass-strong" id="drawer" aria-hidden="true"></section>
<section class="modal glass-strong" id="modal" aria-hidden="true"></section>
<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script src="vendor/supabase.js"></script>
<script src="data.js"></script>
<script src="remote.js"></script>
<script src="app.js"></script>
<script>
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
</script>
</body>
</html>
