<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asociación de Ganaderos TOUCH · Dragopavos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f2faf6;
    --surface:#ffffff;
    --surface-2:#eaf7f0;
    --line:rgba(31,43,35,.10);
    --ink:#1f2b23;
    --ink-soft:#5b6b62;

    --esmeralda:#16a34a;
    --turquesa:#0e9aa0;
    --indigo:#4f46e5;
    --dorado:#f0b301;
    --purpura:#9333ea;
    --orquideo:#e453b0;
    --pelirrojo:#f0653d;
    --ciruela:#7c3a8c;
    --almendrado:#c08552;
    --ebano:#2e2a26;
    --marfil:#c9bc98;

    --ok:#178a4c;
    --warn:#c2660f;
    --shadow: 0 1px 0 rgba(31,43,35,.04), 0 10px 24px -16px rgba(31,43,35,.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
  }
  .wrap{max-width:1080px;margin:0 auto;padding:20px 20px 60px;}

  /* ---------- Header ---------- */
  .banner{
    background:linear-gradient(135deg, #222222 0%, #101010 100%);
    border-left:4px solid #B01E28;
    border-radius:20px;
    padding:40px 48px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:18px;
    box-shadow:var(--shadow);
    position:relative;
    overflow:hidden;
  }
  .banner-text h1{
    font-family:Georgia, 'Times New Roman', serif;
    font-weight:700;
    font-size:clamp(28px, 4vw, 44px);
    color:#FFFFFF;
    line-height:1.1;
    margin:0;
  }
  .banner-text .subtitle{
    font-family:'Courier New', monospace;
    letter-spacing:0.5px;
    font-size:clamp(13px, 1.4vw, 16px);
    color:#D05A52;
    margin-top:14px;
    margin-bottom:0;
  }
  .underline{
    width:36px; height:3px;
    background:#B01E28;
    margin-top:12px;
  }
  .plume{
    flex:0 0 auto; width:110px; height:110px;
  }
  .plume img{
    width:100%; height:100%;
    object-fit:contain;
    display:block;
  }
  .signature{
    text-align:center;
    margin-top:26px;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:.6px;
    color:var(--ink-soft);
  }
  .signature strong{ color:var(--ink); }

  /* ---------- Tabs ---------- */
  .tabs{
    display:flex;
    gap:8px;
    margin:22px 0 0;
    padding:0 2px;
  }
  .tab-btn{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:14.5px;
    background:var(--surface);
    color:var(--ink-soft);
    border:1px solid var(--line);
    padding:10px 20px;
    border-radius:10px;
    cursor:pointer;
    transition:background .15s, color .15s, transform .1s, box-shadow .15s;
  }
  .tab-btn:hover{ transform:translateY(-1px); box-shadow:var(--shadow); }
  .tab-btn.active{
    background:var(--ink);
    color:#fff;
    border-color:var(--ink);
  }
  .panel{ display:none; padding-top:20px; animation:fade .25s ease; }
  .panel.active{ display:block; }
  @keyframes fade{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);} }

  /* ---------- Cards / generic ---------- */
  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:14px;
    padding:18px 20px;
    box-shadow:var(--shadow);
    margin-bottom:18px;
  }
  h2.section-title{
    font-family:'Fraunces',serif;
    font-size:16px;
    margin:0 0 14px;
    color:var(--ink);
    display:flex; align-items:center; gap:8px;
  }
  h2.section-title .rule{ flex:1; height:1px; background:var(--line); }

  .stat-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
    margin-bottom:18px;
  }
  .stat{
    background:var(--surface);
    border:1px solid var(--line);
    border-left:4px solid var(--esmeralda);
    border-radius:12px;
    padding:14px 16px;
    box-shadow:var(--shadow);
  }
  .stat:nth-child(2){ border-left-color:var(--dorado); }
  .stat:nth-child(3){ border-left-color:var(--turquesa); }
  .stat:nth-child(4){ border-left-color:var(--indigo); }
  .stat .num{
    font-family:'IBM Plex Mono',monospace;
    font-weight:600;
    font-size:26px;
    color:var(--ink);
  }
  .stat .label{
    font-size:12px;
    color:var(--ink-soft);
    margin-top:2px;
    text-transform:uppercase;
    letter-spacing:.4px;
  }

  /* ---------- Filters ---------- */
  .filters{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:14px;
    align-items:center;
  }
  select, input[type=text], input[type=number]{
    font-family:'Inter',sans-serif;
    font-size:13.5px;
    padding:7px 10px;
    border-radius:8px;
    border:1px solid var(--line);
    background:var(--surface-2);
    color:var(--ink);
  }
  select:focus, input:focus{ outline:2px solid var(--turquesa); outline-offset:1px; }
  label.chk{
    display:flex; align-items:center; gap:6px;
    font-size:13px; color:var(--ink-soft);
    background:var(--surface-2);
    border:1px solid var(--line);
    padding:6px 10px; border-radius:8px;
  }

  /* ---------- Swatches ---------- */
  .swatch{
    display:inline-block; width:10px; height:10px; border-radius:50%;
    margin-right:3px; border:1px solid rgba(0,0,0,.15); vertical-align:middle;
  }
  .breed-name{ display:inline-flex; align-items:center; gap:4px; flex-wrap:wrap; }

  /* ---------- Table ---------- */
  .table-scroll{ overflow-x:auto; border-radius:12px; border:1px solid var(--line); }
  table{ width:100%; border-collapse:collapse; font-size:13px; background:var(--surface); min-width:640px; }
  thead th{
    text-align:left;
    font-family:'IBM Plex Mono',monospace;
    font-weight:600;
    font-size:11px;
    letter-spacing:.4px;
    text-transform:uppercase;
    color:#fff;
    background:var(--ink);
    padding:9px 12px;
    position:sticky; top:0;
  }
  thead th.sortable{ cursor:pointer; user-select:none; }
  thead th.sortable:hover{ background:var(--esmeralda); }
  tbody td{ padding:8px 12px; border-bottom:1px solid var(--line); vertical-align:middle; }
  tbody tr:hover{ background:var(--surface-2); }
  .star-btn{
    background:none; border:none; cursor:pointer; font-size:16px; line-height:1;
    color:#d8dcd6; padding:2px;
  }
  .star-btn.active{ color:var(--dorado); }
  .pill{
    display:inline-block; padding:2px 8px; border-radius:20px; font-size:11px; font-weight:600;
    font-family:'IBM Plex Mono',monospace;
  }
  .pill.ok{ background:rgba(23,138,76,.12); color:var(--ok); }
  .pill.warn{ background:rgba(194,102,15,.12); color:var(--warn); }
  .pareja-toggle-btn{
    display:inline-block; padding:2px 8px; border-radius:20px; font-size:11px; font-weight:600;
    font-family:'IBM Plex Mono',monospace; cursor:pointer; border:1px solid transparent;
  }
  .pareja-toggle-btn.ok{ background:rgba(23,138,76,.12); color:var(--ok); }
  .pareja-toggle-btn.ok:hover{ border-color:var(--ok); }
  .pareja-toggle-btn.warn{ background:rgba(194,102,15,.12); color:var(--warn); }
  .pareja-toggle-btn.warn:hover{ border-color:var(--warn); }

  /* ---------- Alert ---------- */
  .alert{
    background:rgba(194,102,15,.10);
    border:1px solid rgba(194,102,15,.3);
    color:var(--warn);
    border-radius:12px;
    padding:12px 16px;
    font-size:13.5px;
    margin-bottom:16px;
  }
  .alert strong{ color:#a35012; }

  /* ---------- Parejas controls ---------- */
  .estado-select{ min-width:150px; }
  .notas-input{ width:100%; min-width:120px; }
  .price-input{ width:90px; }
  .cantidad-input{ width:64px; }
  .inv-group{ display:flex; align-items:center; gap:6px; }
  .inv-group label{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-soft); }
  .inv-input{ width:48px; }
  .summary-badges{ display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap; }
  .badge{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    padding:6px 12px;
    border-radius:8px;
    background:var(--surface-2);
    border:1px solid var(--line);
  }

  /* ---------- Proyección ---------- */
  .totals-row td{ font-weight:700; background:var(--surface-2); font-family:'IBM Plex Mono',monospace; }
  .empty-state{
    text-align:center; padding:34px 20px; color:var(--ink-soft);
    font-size:14px; border:1px dashed var(--line); border-radius:12px; background:var(--surface-2);
  }
  .formula-note{
    font-size:12px; color:var(--ink-soft); margin-top:10px; line-height:1.5;
    font-family:'IBM Plex Mono',monospace;
    border-top:1px dashed var(--line); padding-top:10px;
  }
  .period-toggle{ display:flex; gap:6px; margin-bottom:12px; }
  .period-btn{
    font-family:'IBM Plex Mono',monospace; font-size:12px;
    padding:6px 12px; border-radius:8px; border:1px solid var(--line);
    background:var(--surface-2); color:var(--ink-soft); cursor:pointer;
  }
  .period-btn.active{ background:var(--esmeralda); color:#fff; border-color:var(--esmeralda); }

  .birth-time{ font-family:'IBM Plex Mono',monospace; font-size:12.5px; }
  .birth-soon{ color:var(--ok); font-weight:600; }

  .toast{
    position:fixed; bottom:18px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:#fff; padding:10px 18px;
    border-radius:10px; font-size:13px; box-shadow:0 8px 24px rgba(0,0,0,.25);
    opacity:0; pointer-events:none; transition:opacity .25s;
    font-family:'Inter',sans-serif;
  }
  .toast.show{ opacity:1; }

  .loading{ text-align:center; padding:60px 20px; color:var(--ink-soft); font-family:'IBM Plex Mono',monospace; }

  footer.reset-row{ display:flex; justify-content:flex-end; margin-top:6px; }
  .reset-btn{
    font-family:'IBM Plex Mono',monospace; font-size:11.5px;
    background:none; border:1px solid var(--line); color:var(--ink-soft);
    padding:6px 12px; border-radius:8px; cursor:pointer;
  }
  .reset-btn:hover{ border-color:var(--pelirrojo); color:var(--pelirrojo); }

  @media (max-width:720px){
    .stat-grid{ grid-template-columns:repeat(2,1fr); }
    .banner{ flex-direction:column; align-items:flex-start; }
    .plume{ align-self:flex-end; }
  }
</style>
</head>

/* ============================================================
   PREPARACIÓN DE DATOS
   ============================================================ */
const ATTRS = [["Suerte","suerte"],["Fuerza","fuerza"],["Sabiduría","sabiduría"],["Vitalidad","vitalidad"],["Agilidad","agilidad"],["Inteligencia","inteligencia"]];
const SIZES = [["Pequeño","pequeño"],["Mediano","mediano"],["Grande","grande"],["Potente","potente"]];

const COLOR_MAP = {
  "esmeralda":"#16a34a",
  "turquesa":"#0e9aa0",
  "índigo":"#4f46e5",
  "dorado":"#f0b301",
  "púrpura":"#9333ea",
  "orquídeo":"#e453b0",
  "pelirrojo":"#f0653d",
  "ciruela":"#7c3a8c",
  "almendrado":"#c08552",
  "ébano":"#2e2a26",
  "marfil":"#c9bc98"
};

function parsePergamino(raw){
  const lower = raw.toLowerCase();
  const attr = ATTRS.find(([_,k])=>lower.includes(k));
  const size = SIZES.find(([_,k])=>lower.includes(k));
  return { atributo: attr ? attr[0] : "Dorado", tamano: size ? size[0] : "Especial" };
}
function genNum(str){ const m = str.match(/(\d+)/); return m ? parseInt(m[1],10) : 0; }
function colorDots(tipo){
  const lower = tipo.toLowerCase();
  return Object.keys(COLOR_MAP)
    .filter(k=>lower.includes(k))
    .map(k=>`<span class="swatch" style="background:${COLOR_MAP[k]}" title="${k}"></span>`)
    .join("");
}
function formatCO(ts){
  if(!ts) return "—";
  try{
    return new Date(ts).toLocaleString('es-CO', {
      timeZone:'America/Bogota',
      weekday:'short', day:'2-digit', month:'short',
      hour:'2-digit', minute:'2-digit', hour12:true
    }) + " (hora Col.)";
  }catch(e){ return "—"; }
}
function formatCODia(ts){
  if(!ts) return "—";
  try{
    return new Date(ts).toLocaleDateString('es-CO', {
      timeZone:'America/Bogota',
      weekday:'short', day:'2-digit', month:'short'
    });
  }catch(e){ return "—"; }
}

const DATA = RAW_DATA.map(d=>{
  const {atributo, tamano} = parsePergamino(d.pergaminoRaw);
  return {
    ...d,
    gen: genNum(d.genRaw),
    atributo, tamano,
    parejaCompleta: d.hembra && d.macho
  };
});

/* ============================================================
   ESTADO PERSISTENTE (window.storage)
   ============================================================ */
let pairStates = {};   // { id: { estado, notas, inicio(ms) } }
let precios = {};      // { id: number }
let favoritos = {};    // { id: bool }  (override sobre favoritoBase)
let completos = {};    // { id: bool }  (override manual sobre parejaCompleta)
let storageOk = true;

const ESTADOS = [
  {v:"sin_iniciar", label:"Sin iniciar"},
  {v:"en_apareamiento", label:"En apareamiento"},
  {v:"completado", label:"Completado"}
];

async function loadState(){
  try{ const r = await window.storage.get("pairStates", false); pairStates = (r && r.value) ? JSON.parse(r.value) : {}; }
  catch(e){ pairStates = {}; }
  try{ const r = await window.storage.get("precios", false); precios = (r && r.value) ? JSON.parse(r.value) : {}; }
  catch(e){ precios = {}; }
  try{ const r = await window.storage.get("favoritos", false); favoritos = (r && r.value) ? JSON.parse(r.value) : {}; }
  catch(e){ favoritos = {}; }
  try{ const r = await window.storage.get("completos", false); completos = (r && r.value) ? JSON.parse(r.value) : {}; }
  catch(e){ completos = {}; }
}
async function savePairStates(){
  try{ await window.storage.set("pairStates", JSON.stringify(pairStates), false); }
  catch(e){ storageOk=false; showToast("No se pudo guardar el cambio."); }
}
async function savePrecios(){
  try{ await window.storage.set("precios", JSON.stringify(precios), false); }
  catch(e){ storageOk=false; showToast("No se pudo guardar el precio."); }
}
async function saveFavoritos(){
  try{ await window.storage.set("favoritos", JSON.stringify(favoritos), false); }
  catch(e){ storageOk=false; showToast("No se pudo guardar el favorito."); }
}
async function saveCompletos(){
  try{ await window.storage.set("completos", JSON.stringify(completos), false); }
  catch(e){ storageOk=false; showToast("No se pudo guardar el estado de pareja."); }
}

function getPairState(id){ return pairStates[id] || { estado:"sin_iniciar", notas:"", inicio:null }; }
function getPrecio(id){ return Number(precios[id]) || 0; }
function isFavorito(d){ return favoritos[d.id] !== undefined ? favoritos[d.id] : d.favoritoBase; }
function isCompleta(d){ return completos[d.id] !== undefined ? completos[d.id] : d.parejaCompleta; }

function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>t.classList.remove("show"), 2200);
}

/* ============================================================
   RENDER: RAZAS
   ============================================================ */
let razaFilters = { gen:"", atributo:"", certificado:"", favorito:false, q:"" };
let razaSort = { field:null, dir:1 };

function razaSortIcon(field){
  if(razaSort.field !== field) return "";
  return razaSort.dir === 1 ? " &#9650;" : " &#9660;";
}

function renderRazasStats(){
  const total = DATA.length;
  const favCount = DATA.filter(isFavorito).length;
  const completas = DATA.filter(isCompleta).length;
  const counts = {};
  DATA.forEach(d=>counts[d.gen]=(counts[d.gen]||0)+1);
  const domGen = Object.entries(counts).sort((a,b)=>b[1]-a[1])[0];
  return `
  <div class="stat-grid">
    <div class="stat"><div class="num">${total}</div><div class="label">Cabezas registradas</div></div>
    <div class="stat"><div class="num">${favCount}</div><div class="label">Razas favoritas</div></div>
    <div class="stat"><div class="num">${completas}</div><div class="label">Parejas completas</div></div>
    <div class="stat"><div class="num">G${domGen[0]}</div><div class="label">Línea más numerosa (${domGen[1]})</div></div>
  </div>`;
}

function filteredRazas(){
  return DATA.filter(d=>{
    if(razaFilters.gen && String(d.gen) !== razaFilters.gen) return false;
    if(razaFilters.atributo && d.atributo !== razaFilters.atributo) return false;
    if(razaFilters.certificado && d.tamano !== razaFilters.certificado) return false;
    if(razaFilters.favorito && !isFavorito(d)) return false;
    if(razaFilters.q && !d.tipo.toLowerCase().includes(razaFilters.q.toLowerCase())) return false;
    return true;
  });
}

function renderRazasTable(){
  let list = filteredRazas();
  if(razaSort.field){
    list = [...list].sort((a,b)=>{
      const va = a[razaSort.field], vb = b[razaSort.field];
      if(typeof va === "number") return (va-vb)*razaSort.dir;
      return String(va).localeCompare(String(vb), 'es') * razaSort.dir;
    });
  }
  const rows = list.map(d=>{
    const fav = isFavorito(d);
    return `<tr>
      <td><span class="breed-name">${colorDots(d.tipo)} ${d.tipo}</span></td>
      <td>G${d.gen}</td>
      <td>${d.atributo}</td>
      <td>${d.tamano}</td>
      <td>${d.tiempo} h</td>
      <td><button class="pareja-toggle-btn ${isCompleta(d)?'ok':'warn'}" data-id="${d.id}" title="Clic para marcar como completa/incompleta">${isCompleta(d) ? 'Completa' : 'Incompleta'}</button></td>
      <td><button class="star-btn ${fav?'active':''}" data-id="${d.id}" title="Marcar/quitar favorito">&#9733;</button></td>
    </tr>`;
  }).join("");
  return `
  <div class="table-scroll">
  <table>
    <thead><tr>
      <th>Raza</th>
      <th class="sortable" data-sort="gen">Línea${razaSortIcon('gen')}</th>
      <th class="sortable" data-sort="atributo">Atributo${razaSortIcon('atributo')}</th>
      <th>Certificado</th><th>Ciclo</th><th>Pareja</th><th>Fav.</th>
    </tr></thead>
    <tbody>${rows || '<tr><td colspan="7" style="text-align:center;padding:20px;color:var(--ink-soft)">No hay razas que coincidan con el filtro.</td></tr>'}</tbody>
  </table>
  </div>`;
}

function renderRazasFilters(){
  const gens = [...new Set(DATA.map(d=>d.gen))].sort((a,b)=>a-b);
  const attrs = [...new Set(DATA.map(d=>d.atributo))].sort();
  const certs = [...new Set(DATA.map(d=>d.tamano))].sort();
  return `
  <div class="filters">
    <select id="f-gen"><option value="">Todas las líneas</option>${gens.map(g=>`<option value="${g}" ${razaFilters.gen===String(g)?'selected':''}>Generación ${g}</option>`).join("")}</select>
    <select id="f-attr"><option value="">Todos los atributos</option>${attrs.map(a=>`<option value="${a}" ${razaFilters.atributo===a?'selected':''}>${a}</option>`).join("")}</select>
    <select id="f-cert"><option value="">Todos los certificados</option>${certs.map(c=>`<option value="${c}" ${razaFilters.certificado===c?'selected':''}>${c}</option>`).join("")}</select>
    <label class="chk"><input type="checkbox" id="f-fav" ${razaFilters.favorito?'checked':''}> Solo favoritas</label>
    <input type="text" id="f-q" placeholder="Buscar raza..." value="${razaFilters.q}">
  </div>`;
}

function renderRazas(){
  const el = document.getElementById("panel-razas");
  el.innerHTML = `
    ${renderRazasStats()}
    <div class="card">
      <h2 class="section-title">Inventario de razas <span class="rule"></span></h2>
      ${renderRazasFilters()}
      ${renderRazasTable()}
    </div>`;

  document.getElementById("f-gen").addEventListener("change", e=>{ razaFilters.gen=e.target.value; renderRazas(); });
  document.getElementById("f-attr").addEventListener("change", e=>{ razaFilters.atributo=e.target.value; renderRazas(); });
  document.getElementById("f-cert").addEventListener("change", e=>{ razaFilters.certificado=e.target.value; renderRazas(); });
  document.getElementById("f-fav").addEventListener("change", e=>{ razaFilters.favorito=e.target.checked; renderRazas(); });
  document.getElementById("f-q").addEventListener("input", e=>{ razaFilters.q=e.target.value; renderRazas(); });

  el.querySelectorAll("th.sortable").forEach(th=>{
    th.addEventListener("click", ()=>{
      const field = th.dataset.sort;
      if(razaSort.field === field){ razaSort.dir *= -1; }
      else { razaSort = { field, dir:1 }; }
      renderRazas();
    });
  });

  el.querySelectorAll(".star-btn").forEach(btn=>{
    btn.addEventListener("click", async e=>{
      const id = e.currentTarget.dataset.id;
      const d = DATA.find(x=>x.id===id);
      favoritos[id] = !isFavorito(d);
      await saveFavoritos();
      renderRazas();
      showToast(favoritos[id] ? "Marcada como favorita" : "Quitada de favoritas");
    });
  });
  el.querySelectorAll(".pareja-toggle-btn").forEach(btn=>{
    btn.addEventListener("click", async e=>{
      const id = e.currentTarget.dataset.id;
      const d = DATA.find(x=>x.id===id);
      completos[id] = !isCompleta(d);
      await saveCompletos();
      renderRazas();
      showToast(completos[id] ? "Marcada como completa" : "Marcada como incompleta");
    });
  });

  const q = document.getElementById("f-q");
  q.focus();
  q.setSelectionRange(razaFilters.q.length, razaFilters.q.length);
}

/* ============================================================
   RENDER: PAREJAS
   ============================================================ */
let mostrarIncompletas = false;
let soloEnApareamiento = false;
let parejaAtributo = "";
let parejaCertificado = "";
let parejaSort = { field:null, dir:1 };

function getCantidad(id){
  const st = getPairState(id);
  return st.cantidad !== undefined && st.cantidad !== null ? Number(st.cantidad) : 1;
}
function getTotalH(id){
  const st = getPairState(id);
  return st.totalH !== undefined && st.totalH !== null ? Number(st.totalH) : 1;
}
function getTotalM(id){
  const st = getPairState(id);
  return st.totalM !== undefined && st.totalM !== null ? Number(st.totalM) : 1;
}

function sortIcon(field){
  if(parejaSort.field !== field) return "";
  return parejaSort.dir === 1 ? " &#9650;" : " &#9660;";
}

function renderParejas(){
  const el = document.getElementById("panel-parejas");
  const completas = DATA.filter(isCompleta);
  const incompletas = DATA.filter(d=>!isCompleta(d));

  const counts = {sin_iniciar:0, en_apareamiento:0, completado:0};
  completas.forEach(d=>{ counts[getPairState(d.id).estado]++; });

  let list = mostrarIncompletas ? DATA : completas;
  if(soloEnApareamiento){
    list = list.filter(d=>isCompleta(d) && getPairState(d.id).estado === "en_apareamiento");
  }
  if(parejaAtributo){
    list = list.filter(d=>d.atributo === parejaAtributo);
  }
  if(parejaCertificado){
    list = list.filter(d=>d.tamano === parejaCertificado);
  }
  if(parejaSort.field){
    list = [...list].sort((a,b)=>{
      const va = a[parejaSort.field], vb = b[parejaSort.field];
      if(typeof va === "number") return (va-vb)*parejaSort.dir;
      return String(va).localeCompare(String(vb), 'es') * parejaSort.dir;
    });
  }

  const rows = list.map(d=>{
    const state = getPairState(d.id);
    const disabled = !isCompleta(d) ? "disabled" : "";
    return `<tr data-id="${d.id}">
      <td><span class="breed-name">${colorDots(d.tipo)} ${d.tipo}</span></td>
      <td>${d.atributo}</td>
      <td>${d.tamano}</td>
      <td><button class="pareja-toggle-btn ${isCompleta(d)?'ok':'warn'}" data-id="${d.id}" title="Clic para marcar como completa/incompleta">${isCompleta(d) ? 'Completa' : 'Falta '+(d.hembra?'macho':'hembra')}</button></td>
      <td>
        <select class="estado-select" data-id="${d.id}" ${disabled}>
          ${ESTADOS.map(s=>`<option value="${s.v}" ${state.estado===s.v?'selected':''}>${s.label}</option>`).join("")}
        </select>
      </td>
      <td><input type="number" min="0" step="1" class="cantidad-input" data-id="${d.id}" value="${getCantidad(d.id)}" ${disabled}></td>
      <td>
        <div class="inv-group">
          <label for="">H</label><input type="number" min="0" step="1" class="inv-input inv-h" data-id="${d.id}" value="${getTotalH(d.id)}" ${disabled}>
          <label for="">M</label><input type="number" min="0" step="1" class="inv-input inv-m" data-id="${d.id}" value="${getTotalM(d.id)}" ${disabled}>
        </div>
      </td>
      <td><input type="number" min="0" step="1" class="price-input" data-id="${d.id}" value="${getPrecio(d.id)}" ${disabled}></td>
      <td><input type="text" class="notas-input" data-id="${d.id}" placeholder="Notas..." value="${state.notas ? state.notas.replace(/"/g,'&quot;') : ''}" ${disabled}></td>
    </tr>`;
  }).join("");

  const attrs = [...new Set(DATA.map(d=>d.atributo))].sort();
  const certs = [...new Set(DATA.map(d=>d.tamano))].sort();

  el.innerHTML = `
    ${incompletas.length ? `<div class="alert"><strong>${incompletas.length} cabeza(s)</strong> sin pareja completa todavía — necesitan macho o hembra antes de poder registrarse como pareja reproductora.</div>` : ""}
    <div class="card">
      <h2 class="section-title">Control de apareamiento <span class="rule"></span></h2>
      <div class="summary-badges">
        <span class="badge">Sin iniciar: <strong>${counts.sin_iniciar}</strong></span>
        <span class="badge">En apareamiento: <strong>${counts.en_apareamiento}</strong></span>
        <span class="badge">Completado: <strong>${counts.completado}</strong></span>
      </div>
      <p class="formula-note" style="margin-top:-6px; margin-bottom:14px; border-top:none; padding-top:0;">
        <strong>Sin iniciar</strong>: aún no la has puesto a trabajar. &middot;
        <strong>En apareamiento</strong>: está activa ahora mismo — desde aquí cuenta el tiempo hasta el nacimiento en Proyección. &middot;
        <strong>Completado</strong>: es solo tu marca personal para decir "ya cerré este ciclo por ahora" — no dispara ningún cálculo, la usas cuando tú quieras dejar de contarla como activa sin borrar su historial.
      </p>
      <div class="filters">
        <select id="f-attr-pareja"><option value="">Todos los atributos</option>${attrs.map(a=>`<option value="${a}" ${parejaAtributo===a?'selected':''}>${a}</option>`).join("")}</select>
        <select id="f-cert-pareja"><option value="">Todos los certificados</option>${certs.map(c=>`<option value="${c}" ${parejaCertificado===c?'selected':''}>${c}</option>`).join("")}</select>
        <label class="chk"><input type="checkbox" id="f-en-apareamiento" ${soloEnApareamiento?'checked':''}> Solo en apareamiento</label>
        <label class="chk"><input type="checkbox" id="show-incomplete" ${mostrarIncompletas?'checked':''}> Mostrar incompletas (${incompletas.length})</label>
      </div>
      <div class="table-scroll">
      <table>
        <thead><tr>
          <th>Raza</th>
          <th class="sortable" data-sort="atributo">Atributo${sortIcon('atributo')}</th>
          <th class="sortable" data-sort="tamano">Certificado${sortIcon('tamano')}</th>
          <th>Sexos</th><th>Estado apareamiento</th><th>Hembras en cría</th><th>Inventario H / M</th><th>Precio/cría</th><th>Notas</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
      </div>
      <p class="formula-note">El precio y la cantidad de hembras en cría que definas aquí son los que usa por defecto la pestaña Proyección (ingreso = precio × cantidad × ciclos proyectados).</p>
    </div>`;

  document.getElementById("show-incomplete").addEventListener("change", e=>{
    mostrarIncompletas = e.target.checked;
    renderParejas();
  });
  document.getElementById("f-en-apareamiento").addEventListener("change", e=>{
    soloEnApareamiento = e.target.checked;
    renderParejas();
  });
  document.getElementById("f-attr-pareja").addEventListener("change", e=>{
    parejaAtributo = e.target.value;
    renderParejas();
  });
  document.getElementById("f-cert-pareja").addEventListener("change", e=>{
    parejaCertificado = e.target.value;
    renderParejas();
  });
  el.querySelectorAll("th.sortable").forEach(th=>{
    th.addEventListener("click", ()=>{
      const field = th.dataset.sort;
      if(parejaSort.field === field){ parejaSort.dir *= -1; }
      else { parejaSort = { field, dir:1 }; }
      renderParejas();
    });
  });
  el.querySelectorAll(".pareja-toggle-btn").forEach(btn=>{
    btn.addEventListener("click", async e=>{
      const id = e.currentTarget.dataset.id;
      const d = DATA.find(x=>x.id===id);
      completos[id] = !isCompleta(d);
      await saveCompletos();
      renderParejas();
      renderRazas();
      renderProyeccion();
      showToast(completos[id] ? "Marcada como completa" : "Marcada como incompleta");
    });
  });

  el.querySelectorAll(".estado-select").forEach(sel=>{
    sel.addEventListener("change", async e=>{
      const id = e.target.dataset.id;
      const current = getPairState(id);
      const nuevoEstado = e.target.value;
      let inicio = current.inicio || null;
      if(nuevoEstado === "en_apareamiento" && current.estado !== "en_apareamiento"){
        inicio = Date.now();
      }
      pairStates[id] = { ...current, estado: nuevoEstado, inicio };
      await savePairStates();
      showToast("Estado actualizado");
      renderParejas();
      renderProyeccion();
    });
  });
  el.querySelectorAll(".notas-input").forEach(inp=>{
    inp.addEventListener("blur", async e=>{
      const id = e.target.dataset.id;
      const current = getPairState(id);
      pairStates[id] = { ...current, notas: e.target.value };
      await savePairStates();
    });
  });
  el.querySelectorAll(".cantidad-input").forEach(inp=>{
    inp.addEventListener("change", async e=>{
      const id = e.target.dataset.id;
      const current = getPairState(id);
      pairStates[id] = { ...current, cantidad: Number(e.target.value) || 0 };
      await savePairStates();
      renderProyeccion();
    });
  });
  el.querySelectorAll(".inv-h").forEach(inp=>{
    inp.addEventListener("change", async e=>{
      const id = e.target.dataset.id;
      const current = getPairState(id);
      pairStates[id] = { ...current, totalH: Number(e.target.value) || 0 };
      await savePairStates();
    });
  });
  el.querySelectorAll(".inv-m").forEach(inp=>{
    inp.addEventListener("change", async e=>{
      const id = e.target.dataset.id;
      const current = getPairState(id);
      pairStates[id] = { ...current, totalM: Number(e.target.value) || 0 };
      await savePairStates();
    });
  });
  el.querySelectorAll(".price-input").forEach(inp=>{
    inp.addEventListener("change", async e=>{
      const id = e.target.dataset.id;
      precios[id] = Number(e.target.value) || 0;
      await savePrecios();
      renderProyeccion();
    });
  });
}

/* ============================================================
   RENDER: PROYECCIÓN
   ============================================================ */
let periodo = "semana"; // dia | semana | mes

function renderProyeccion(){
  const el = document.getElementById("panel-proyeccion");
  const activos = DATA.filter(d=>isCompleta(d) && getPairState(d.id).estado === "en_apareamiento");

  const byGen = {};
  activos.forEach(d=>{
    if(!byGen[d.gen]) byGen[d.gen] = { count:0, tiempo:d.tiempo, dineroSemana:0, criasSemana:0 };
    const ciclosSemana = (24*7)/d.tiempo;
    const criasSemana = ciclosSemana * getCantidad(d.id);
    const dineroSemana = criasSemana * getPrecio(d.id);
    byGen[d.gen].count++;
    byGen[d.gen].criasSemana += criasSemana;
    byGen[d.gen].dineroSemana += dineroSemana;
  });

  const factor = periodo === "dia" ? 1/7 : periodo === "mes" ? 4.345 : 1;

  let bodyRows = "", totalCrias = 0, totalDinero = 0;
  Object.keys(byGen).sort((a,b)=>a-b).forEach(g=>{
    const grp = byGen[g];
    const ciclosSemana = (24*7)/grp.tiempo;
    const crias = grp.criasSemana * factor;
    const dinero = grp.dineroSemana * factor;
    totalCrias += crias; totalDinero += dinero;
    bodyRows += `<tr>
      <td>Generación ${g}</td>
      <td>${grp.count}</td>
      <td>${grp.tiempo} h</td>
      <td>${ciclosSemana.toFixed(2)}</td>
      <td>${crias.toFixed(1)}</td>
      <td>$${dinero.toLocaleString('es-CO', {maximumFractionDigits:0})}</td>
    </tr>`;
  });

  const resumenBlock = Object.keys(byGen).length ? `
    <div class="table-scroll">
    <table>
      <thead><tr><th>Línea</th><th>Parejas activas</th><th>Ciclo</th><th>Ciclos/sem</th><th>Crías (${periodo})</th><th>Ingreso (${periodo})</th></tr></thead>
      <tbody>${bodyRows}</tbody>
      <tfoot>
        <tr class="totals-row">
          <td colspan="4">TOTAL</td>
          <td>${totalCrias.toFixed(1)}</td>
          <td>$${totalDinero.toLocaleString('es-CO',{maximumFractionDigits:0})}</td>
        </tr>
      </tfoot>
    </table>
    </div>
    <p class="formula-note">
      Ciclos/semana = (24 × 7) ÷ Ciclo del pergamino (horas). &middot;
      Crías proyectadas = parejas activas × ciclos/semana × hembras en cría (definidas en Parejas). &middot;
      Ingreso = crías proyectadas × precio/cría definido en la pestaña Parejas.
    </p>` : `
    <div class="empty-state">
      Aún no tienes parejas marcadas como <strong>&laquo;En apareamiento&raquo;</strong>.<br>
      Ve a la pestaña <strong>Parejas</strong> y cambia el estado de las que estés trabajando para ver aquí la producción proyectada.
    </div>`;

  const now = Date.now();
  const nacimientos = activos
    .map(d=>{
      const st = getPairState(d.id);
      const nace = st.inicio ? st.inicio + d.tiempo*3600*1000 : null;
      return {d, inicio:st.inicio, nace};
    })
    .filter(x=>x.nace)
    .sort((a,b)=>a.nace-b.nace);

  const nacimientosBlock = nacimientos.length ? `
    <div class="table-scroll">
    <table>
      <thead><tr><th>Raza</th><th>Línea</th><th>Horas de gestación</th><th>Inicio</th><th>Nace aprox.</th><th>Precio/cría</th></tr></thead>
      <tbody>
        ${nacimientos.map(x=>`<tr>
          <td><span class="breed-name">${colorDots(x.d.tipo)} ${x.d.tipo}</span></td>
          <td>G${x.d.gen}</td>
          <td>${x.d.tiempo} h</td>
          <td class="birth-time">${formatCODia(x.inicio)}</td>
          <td class="birth-time ${x.nace-now < 3600*1000*3 ? 'birth-soon' : ''}">${formatCO(x.nace)}</td>
          <td>$${getPrecio(x.d.id).toLocaleString('es-CO')}</td>
        </tr>`).join("")}
      </tbody>
    </table>
    </div>` : `<div class="empty-state">Sin nacimientos programados todavía.</div>`;

  el.innerHTML = `
    <div class="card">
      <h2 class="section-title">Producción e ingresos proyectados <span class="rule"></span></h2>
      <div class="period-toggle">
        <button class="period-btn ${periodo==='dia'?'active':''}" data-p="dia">Por día</button>
        <button class="period-btn ${periodo==='semana'?'active':''}" data-p="semana">Por semana</button>
        <button class="period-btn ${periodo==='mes'?'active':''}" data-p="mes">Por mes</button>
      </div>
      ${resumenBlock}
    </div>
    <div class="card">
      <h2 class="section-title">Próximos nacimientos <span class="rule"></span></h2>
      ${nacimientosBlock}
    </div>`;

  el.querySelectorAll(".period-btn").forEach(b=>{
    b.addEventListener("click", ()=>{ periodo = b.dataset.p; renderProyeccion(); });
  });
}

/* ============================================================
   INIT
   ============================================================ */
async function init(){
  await loadState();
  document.getElementById("app").innerHTML = `
    <div class="panel active" id="panel-razas"></div>
    <div class="panel" id="panel-parejas"></div>
    <div class="panel" id="panel-proyeccion"></div>
    <footer class="reset-row">
      <button class="reset-btn" id="reset-btn">Restablecer parejas, precios, favoritos y estados</button>
    </footer>
    <p class="signature">Panel elaborado por <strong>Pavino-P&eacute;rez</strong></p>`;
  renderRazas();
  renderParejas();
  renderProyeccion();

  document.getElementById("reset-btn").addEventListener("click", async ()=>{
    if(!confirm("Esto borrará el estado de apareamiento, notas, precios, favoritos y las marcas de completa/incompleta guardadas. ¿Continuar?")) return;
    pairStates = {}; precios = {}; favoritos = {}; completos = {};
    await savePairStates(); await savePrecios(); await saveFavoritos(); await saveCompletos();
    renderRazas(); renderParejas(); renderProyeccion();
    showToast("Datos restablecidos");
  });

  if(!storageOk){ showToast("El guardado automático no está disponible en este momento."); }
}

init();
</script>
